<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalGrammar — Offline Spell & Grammar Checker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,600;1,400&display=swap');

[data-theme="dark"] {
  --bg:#0d0f14; --surface:#151820; --surface2:#1c2030; --border:#252a3a;
  --text:#e8eaf0; --muted:#6b7280; --accent:#4fd1c5; --accent2:#f6c90e;
  --accent3:#ff6b6b; --accent4:#a78bfa;
  --spell-bg:rgba(255,107,107,0.14); --spell-ul:#ff6b6b;
  --gram-bg:rgba(246,201,14,0.10); --gram-ul:#f6c90e;
  --popup-bg:#1c2030; --popup-border:#353a50;
  --shadow:0 8px 32px rgba(0,0,0,0.55);
  --grid:rgba(79,209,197,0.03); --on-accent:#0d0f14;
}
[data-theme="light"] {
  --bg:#f0f4fb; --surface:#ffffff; --surface2:#e8edf8; --border:#cdd5e8;
  --text:#1a1f2e; --muted:#6b7a99; --accent:#0891b2; --accent2:#b45309;
  --accent3:#dc2626; --accent4:#7c3aed;
  --spell-bg:rgba(220,38,38,0.08); --spell-ul:#dc2626;
  --gram-bg:rgba(180,83,9,0.07); --gram-ul:#b45309;
  --popup-bg:#ffffff; --popup-border:#cdd5e8;
  --shadow:0 8px 32px rgba(0,0,0,0.11);
  --grid:rgba(8,145,178,0.04); --on-accent:#ffffff;
}

*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Lora',Georgia,serif;min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}

.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 18px 60px;}

/* HEADER */
header{display:flex;align-items:center;justify-content:space-between;padding:20px 0 22px;border-bottom:1px solid var(--border);margin-bottom:24px;flex-wrap:wrap;gap:12px;}
.logo{display:flex;align-items:baseline;gap:9px;}
.logo-mark{font-family:'Syne',sans-serif;font-weight:800;font-size:23px;color:var(--accent);letter-spacing:-1px;}
.logo-sub{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}
.hdr-right{display:flex;align-items:center;gap:11px;flex-wrap:wrap;}

/* Theme toggle */
.theme-btn{display:flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:5px 11px;cursor:pointer;font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);transition:all .2s;user-select:none;}
.theme-btn:hover{border-color:var(--accent);color:var(--accent);}
.trk{width:30px;height:16px;background:var(--border);border-radius:10px;position:relative;transition:background .25s;}
.trk.on{background:var(--accent);}
.tthumb{width:10px;height:10px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:left .2s;}
.trk.on .tthumb{left:17px;}

.badge{display:inline-flex;align-items:center;gap:6px;background:rgba(79,209,197,0.08);border:1px solid rgba(79,209,197,0.22);border-radius:20px;padding:5px 11px;font-family:'DM Mono',monospace;font-size:10px;color:var(--accent);letter-spacing:1px;}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 5px var(--accent);animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}

/* DOMAIN BAR */
.dbar{display:flex;align-items:center;gap:7px;margin-bottom:16px;flex-wrap:wrap;}
.dlabel{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;}
.dbtn{font-family:'DM Mono',monospace;font-size:11px;padding:4px 10px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;transition:all .14s;}
.dbtn:hover{border-color:var(--accent);color:var(--accent);}
.dbtn.on{background:rgba(79,209,197,0.09);border-color:var(--accent);color:var(--accent);}

/* LAYOUT */
.layout{display:grid;grid-template-columns:1fr 305px;gap:18px;align-items:start;}
@media(max-width:800px){.layout{grid-template-columns:1fr;}}

/* EDITOR PANEL */
.epanel{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.etbar{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;border-bottom:1px solid var(--border);background:var(--surface2);flex-wrap:wrap;gap:8px;}
.etitle{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;}
.tactions{display:flex;gap:6px;flex-wrap:wrap;}
.abtn{font-family:'DM Mono',monospace;font-size:11px;padding:5px 11px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .14s;}
.abtn:hover{color:var(--text);border-color:var(--text);}
.abtn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600;}
.abtn.primary:hover{opacity:.85;}
.abtn.fixall{background:rgba(79,209,197,0.09);border-color:var(--accent);color:var(--accent);}
.abtn.fixall:hover{background:rgba(79,209,197,0.18);}

.editor-container{position:relative;}
#ta{width:100%;min-height:250px;background:transparent;border:none;outline:none;color:var(--text);font-family:'Lora',Georgia,serif;font-size:16px;line-height:1.85;padding:18px 18px 60px;resize:vertical;caret-color:var(--accent);}
#ta::placeholder{color:var(--muted);opacity:.45;font-style:italic;}
#ta::-webkit-scrollbar{width:4px;}
#ta::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

#odisplay{position:absolute;top:0;left:0;right:0;min-height:250px;padding:18px;font-family:'Lora',Georgia,serif;font-size:16px;line-height:1.85;color:var(--text);word-break:break-word;white-space:pre-wrap;cursor:text;pointer-events:none;opacity:0;transition:opacity .2s;}
#odisplay.active{pointer-events:auto;opacity:1;}

.hl-spell{background:var(--spell-bg);border-bottom:2px solid var(--spell-ul);border-radius:2px;cursor:pointer;color:var(--spell-ul);transition:filter .12s;pointer-events:auto;}
.hl-spell:hover{filter:brightness(1.2);}
.hl-gram{background:var(--gram-bg);border-bottom:2px dashed var(--gram-ul);border-radius:2px;cursor:pointer;color:var(--accent2);transition:filter .12s;pointer-events:auto;}
.hl-gram:hover{filter:brightness(1.15);}

.efooter{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-top:1px solid var(--border);background:var(--surface2);flex-wrap:wrap;gap:6px;}
.wc{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);}
.wc span{color:var(--accent);}
.hint{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);}

/* POPUP */
#popup{display:none;position:fixed;z-index:9999;background:var(--popup-bg);border:1px solid var(--popup-border);border-radius:10px;box-shadow:var(--shadow);min-width:195px;max-width:270px;overflow:hidden;animation:popIn .14s ease;}
@keyframes popIn{from{opacity:0;transform:scale(.95) translateY(-4px)}to{opacity:1;transform:scale(1) translateY(0)}}
.ph{padding:7px 11px 6px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;}
.pw{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pt{font-family:'DM Mono',monospace;font-size:10px;padding:2px 6px;border-radius:3px;}
.pt.sp{background:rgba(255,107,107,0.18);color:var(--spell-ul);}
.pt.gr{background:rgba(246,201,14,0.18);color:var(--gram-ul);}
.pclose{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0 2px;transition:color .1s;}
.pclose:hover{color:var(--text);}
.pmsg{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);padding:6px 11px 4px;}
.psug-list{padding:4px 7px 7px;display:flex;flex-direction:column;gap:3px;}
.psug{font-family:'DM Mono',monospace;font-size:12px;padding:6px 11px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;text-align:left;transition:all .11s;display:flex;align-items:center;justify-content:space-between;}
.psug:hover{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
.psug .arr{opacity:.35;font-size:10px;}
.psug:hover .arr{opacity:1;}
.pno{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);padding:5px 11px 9px;}
.pignore{width:100%;padding:7px 11px;border:none;border-top:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:'DM Mono',monospace;font-size:11px;text-align:center;transition:all .11s;}
.pignore:hover{color:var(--text);background:var(--surface2);}

/* SIDEBAR */
.sidebar{display:flex;flex-direction:column;gap:14px;}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.phead{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;background:var(--surface2);border-bottom:1px solid var(--border);}
.ptitle{font-family:'Syne',sans-serif;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);}

.score-wrap{display:flex;align-items:center;justify-content:center;padding:18px;flex-direction:column;gap:7px;}
.sring{width:78px;height:78px;position:relative;}
.sring svg{transform:rotate(-90deg);width:78px;height:78px;}
.rbg{fill:none;stroke:var(--border);stroke-width:6;}
.rfill{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;stroke-dasharray:220;stroke-dashoffset:220;transition:stroke-dashoffset .7s ease,stroke .3s;}
.snum{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--accent);}
.slabel{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;text-align:center;}

.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);}
.scell{background:var(--surface);padding:11px 12px;text-align:center;}
.sn{font-family:'Syne',sans-serif;font-size:21px;font-weight:800;color:var(--accent);line-height:1;margin-bottom:2px;}
.sl{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;}

.tabs{display:flex;border-bottom:1px solid var(--border);}
.tbtn{flex:1;font-family:'DM Mono',monospace;font-size:11px;padding:9px 5px;border:none;background:var(--surface2);color:var(--muted);cursor:pointer;text-transform:uppercase;letter-spacing:.7px;transition:all .14s;border-bottom:2px solid transparent;}
.tbtn:hover{color:var(--text);}
.tbtn.on{background:var(--surface);color:var(--accent);border-bottom-color:var(--accent);}

.issue-list{max-height:420px;overflow-y:auto;}
.issue-list::-webkit-scrollbar{width:4px;}
.issue-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 18px;color:var(--muted);text-align:center;}
.ei{font-size:32px;margin-bottom:8px;opacity:.5;}
.em{font-family:'DM Mono',monospace;font-size:11px;line-height:1.5;}

.icard{border-bottom:1px solid var(--border);padding:11px 13px;cursor:pointer;transition:background .11s;}
.icard:hover{background:var(--surface2);}
.icard:last-child{border-bottom:none;}
.iw{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;color:var(--text);margin-bottom:3px;}
.iw.sp{color:var(--spell-ul);}
.iw.gr{color:var(--accent2);}
.im{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);line-height:1.4;}

/* TOAST */
#toast{position:fixed;bottom:30px;right:30px;background:var(--accent);color:var(--on-accent);padding:11px 18px;border-radius:8px;font-family:'DM Mono',monospace;font-size:12px;font-weight:500;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10000;}
#toast.show{opacity:1;}

@media(max-width:500px){
  .logo-mark{font-size:19px;}
  .logo-sub{font-size:9px;}
  .etitle{font-size:9px;}
  .abtn{font-size:10px;padding:4px 8px;}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <div class="logo-mark">LocalGrammar</div>
      <div class="logo-sub">Offline Checker</div>
    </div>
    <div class="hdr-right">
      <div class="badge">OFFLINE MODE</div>
      <div class="theme-btn" onclick="toggleTheme()">
        <span id="ticon">🌙</span>
        <div class="trk on" id="trk"><div class="tthumb"></div></div>
        <span id="tlbl">Dark</span>
      </div>
    </div>
  </header>

  <div class="dbar">
    <div class="dlabel">Context:</div>
    <button class="dbtn on" data-d="all" onclick="setDomain('all',this)">All Domains</button>
    <button class="dbtn" data-d="general" onclick="setDomain('general',this)">General</button>
    <button class="dbtn" data-d="academic" onclick="setDomain('academic',this)">Academic</button>
    <button class="dbtn" data-d="business" onclick="setDomain('business',this)">Business</button>
    <button class="dbtn" data-d="creative" onclick="setDomain('creative',this)">Creative</button>
  </div>

  <div class="layout">
    <div class="epanel">
      <div class="etbar">
        <div class="etitle">Your Text</div>
        <div class="tactions">
          <button class="abtn primary" onclick="checkText()">🔍 Check</button>
          <button class="abtn fixall" id="fixall-btn" style="display:none" onclick="fixAll()">✨ Fix All</button>
          <button class="abtn" onclick="copyFixed()">📋 Copy</button>
          <button class="abtn" onclick="clearAll()">🗑️ Clear</button>
        </div>
      </div>
      <div class="editor-container">
        <textarea id="ta" placeholder="Start typing or paste your text here..." oninput="onInput()"></textarea>
        <div id="odisplay"></div>
      </div>
      <div class="efooter">
        <div class="wc">Words: <span id="wc">0</span> &nbsp;·&nbsp; Characters: <span id="cc">0</span></div>
        <div class="hint">Tip: Click on highlighted errors for suggestions</div>
      </div>
    </div>

    <aside class="sidebar">
      <div class="panel">
        <div class="phead"><div class="ptitle">Quality Score</div></div>
        <div class="score-wrap">
          <div class="sring">
            <svg><circle class="rbg" cx="39" cy="39" r="35"></circle><circle class="rfill" id="rfill" cx="39" cy="39" r="35"></circle></svg>
            <div class="snum" id="snum">—</div>
          </div>
          <div class="slabel" id="slabel">Check to score</div>
        </div>
        <div class="sgrid">
          <div class="scell"><div class="sn" id="ss">0</div><div class="sl">Spelling</div></div>
          <div class="scell"><div class="sn" id="sg">0</div><div class="sl">Grammar</div></div>
          <div class="scell"><div class="sn" id="sw">0</div><div class="sl">Words</div></div>
          <div class="scell"><div class="sn" id="sst">0</div><div class="sl">Sentences</div></div>
        </div>
      </div>

      <div class="panel">
        <div class="tabs">
          <button class="tbtn on" id="tsp" onclick="switchTab('sp')">🔴 Spelling</button>
          <button class="tbtn" id="tgr" onclick="switchTab('gr')">🟡 Grammar</button>
        </div>
        <div class="issue-list" id="splist"><div class="empty"><div class="ei">✏️</div><div class="em">Check text to see issues</div></div></div>
        <div class="issue-list" id="grlist" style="display:none"><div class="empty"><div class="ei">📝</div><div class="em">Check text to see issues</div></div></div>
      </div>
    </aside>
  </div>
</div>

<div id="popup">
  <div class="ph">
    <div class="pw" id="pword"></div>
    <div class="pt" id="ptype"></div>
    <button class="pclose" onclick="closePopup()">×</button>
  </div>
  <div class="pmsg" id="pmsg"></div>
  <div class="psug-list" id="psug"></div>
  <button class="pignore" id="pign" onclick="ignoreWord()">Ignore Word</button>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════════
// EXPANDED ENGLISH DICTIONARY (20,000+ common words)
// ══════════════════════════════════════════════════════════════

  "drink","drank","drunk","drinking","drive","drove","driven","driving","drop","dropped","dropping","earn","earned",
  "earning","eat","ate","eaten","eating","enable","enabled","enabling","encourage","encouraged","encouraging","end",
  "ended","ending","enjoy","enjoyed","enjoying","ensure","ensured","ensuring","enter","entered","entering","establish",

// GLOBAL STATE
// ══════════════════════════════════════════════════════════════
var spellErrors = [];
var grammarErrors = [];
var isChecked = false;
var curTab = "sp";
var ignoredWords = {};
var activeDomains = {all: true};
var savedCursorPosition = 0;

// ══════════════════════════════════════════════════════════════
// CHECK TEXT FUNCTION (IMPROVED)
// ══════════════════════════════════════════════════════════════
function checkText() {
  var ta = document.getElementById("ta");
  var text = ta.value.trim();
  
  if (!text) {
    showToast("Please enter some text first");
    return;
  }
  
  // Save cursor position before checking
  savedCursorPosition = ta.selectionStart;
  
  spellErrors = [];
  grammarErrors = [];
  
  // Split into words for spell checking
  var words = text.match(/\b[a-z']+\b/gi) || [];
  var uniqueWords = {};
  
  words.forEach(function(w) {
    var lower = w.toLowerCase();
    if (!DICT.has(lower) && !ignoredWords[lower] && !uniqueWords[lower]) {
      uniqueWords[lower] = w;
    }
  });
  
  for (var w in uniqueWords) {
    spellErrors.push({
      word: uniqueWords[w],
      suggestions: getSuggestions(w)
    });
  }
  
  // Grammar checking based on active domains
  var patterns = [];
  if (activeDomains.all) {
    for (var domain in GRAM_PATTERNS) {
      patterns = patterns.concat(GRAM_PATTERNS[domain]);
    }
  } else {
    for (var domain in activeDomains) {
      if (GRAM_PATTERNS[domain]) {
        patterns = patterns.concat(GRAM_PATTERNS[domain]);
      }
    }
  }
  
  patterns.forEach(function(p) {
    var matches = [];
    var m;
    while ((m = p.rx.exec(text)) !== null) {
      matches.push({
        text: m[0],
        index: m.index,
        groups: m
      });
    }
    
    matches.forEach(function(match) {
      grammarErrors.push({
        word: match.text,
        message: p.msg,
        suggestion: p.sugg ? (typeof p.sugg === "function" ? p.sugg(match.groups) : p.sugg) : null,
        index: match.index
      });
    });
  });
  
  // Display results with overlay
  displayResults(text);
  updateStats();
  isChecked = true;
  
  // Show fix all button if there are errors
  if (spellErrors.length > 0 || grammarErrors.length > 0) {
    document.getElementById("fixall-btn").style.display = "inline-block";
  }
  
  showToast("Check complete! Found " + (spellErrors.length + grammarErrors.length) + " issues");
}

// DISPLAY RESULTS WITH OVERLAY (IMPROVED - NO FOCUS LOSS)
// ══════════════════════════════════════════════════════════════
function displayResults(text) {
  var ta = document.getElementById("ta");
  var odisplay = document.getElementById("odisplay");
  
  // Build highlighted version
  var html = escH(text);
  
  // Apply spell highlights
  spellErrors.forEach(function(err) {
    var pattern = new RegExp("\\b(" + escRe(err.word) + ")\\b", "gi");
    html = html.replace(pattern, '<span class="hl-spell" onclick="showPopup(event,\'$1\',\'spell\')">$1</span>');
  });
  
  // Apply grammar highlights
  grammarErrors.forEach(function(err) {
    var pattern = new RegExp("(" + escRe(err.word) + ")", "gi");
    html = html.replace(pattern, '<span class="hl-gram" onclick="showPopup(event,\'$1\',\'grammar\')">$1</span>');
  });
  
  odisplay.innerHTML = html;
  odisplay.classList.add("active");
  
  // Update sidebar
  updateSidebar();
  
  // Restore cursor position
  setTimeout(function() {
    ta.focus();
    ta.setSelectionRange(savedCursorPosition, savedCursorPosition);
  }, 50);
}

// ══════════════════════════════════════════════════════════════
// SUGGESTIONS ALGORITHM (EDIT DISTANCE)
// ══════════════════════════════════════════════════════════════
function getSuggestions(word) {
  var suggestions = [];
  var maxDist = word.length <= 4 ? 1 : 2;
  
  DICT.forEach(function(dictWord) {
    if (Math.abs(dictWord.length - word.length) <= maxDist) {
      var dist = levenshtein(word.toLowerCase(), dictWord);
      if (dist <= maxDist) {
        suggestions.push({word: dictWord, dist: dist});
      }
    }
  });
  
  suggestions.sort(function(a, b) {
    return a.dist - b.dist;
  });
  
  return suggestions.slice(0, 5).map(function(s) { return s.word; });
}

function levenshtein(a, b) {
  var matrix = [];
  for (var i = 0; i <= b.length; i++) {
    matrix[i] = [i];
  }
  for (var j = 0; j <= a.length; j++) {
    matrix[0][j] = j;
  }
  for (i = 1; i <= b.length; i++) {
    for (j = 1; j <= a.length; j++) {
      if (b.charAt(i-1) === a.charAt(j-1)) {
        matrix[i][j] = matrix[i-1][j-1];
      } else {
        matrix[i][j] = Math.min(
          matrix[i-1][j-1] + 1,
          matrix[i][j-1] + 1,
          matrix[i-1][j] + 1
        );
      }
    }
  }
  return matrix[b.length][a.length];
}

// ══════════════════════════════════════════════════════════════
// UPDATE STATS
// ══════════════════════════════════════════════════════════════
function updateStats() {
  var text = document.getElementById("ta").value;
  var words = text.trim() ? text.trim().split(/\s+/).length : 0;
  var sentences = (text.match(/[.!?]+/g) || []).length;
  
  var totalErrors = spellErrors.length + grammarErrors.length;
  var score = Math.max(0, Math.min(100, 100 - (totalErrors * 2)));
  
  document.getElementById("ss").textContent = spellErrors.length;
  document.getElementById("sg").textContent = grammarErrors.length;
  document.getElementById("sw").textContent = words;
  document.getElementById("sst").textContent = sentences;
  
  document.getElementById("snum").textContent = score;
  document.getElementById("slabel").textContent = score >= 90 ? "Excellent!" : score >= 70 ? "Good" : "Needs work";
  
  var offset = 220 - (220 * score / 100);
  document.getElementById("rfill").style.strokeDashoffset = offset;
  
  var spBadge = spellErrors.length > 0 ? " (" + spellErrors.length + ")" : "";
  var grBadge = grammarErrors.length > 0 ? " (" + grammarErrors.length + ")" : "";
  document.getElementById("tsp").textContent = "🔴 Spelling" + spBadge;
  document.getElementById("tgr").textContent = "🟡 Grammar" + grBadge;
}

    });
    grlist.innerHTML = html;
  }
}

// ══════════════════════════════════════════════════════════════
// POPUP HANDLING (IMPROVED)
// ══════════════════════════════════════════════════════════════
function showPopup(e, word, type) {
  e.stopPropagation();
  var popup = document.getElementById("popup");
  var error = type === "spell" 
    ? spellErrors.find(function(err) { return err.word.toLowerCase() === word.toLowerCase(); })
    : grammarErrors.find(function(err) { return err.word.toLowerCase() === word.toLowerCase(); });
  
  if (!error) return;
  
  document.getElementById("pword").textContent = word;
  document.getElementById("ptype").textContent = type === "spell" ? "SPELL" : "GRAMMAR";
  document.getElementById("ptype").className = "pt " + (type === "spell" ? "sp" : "gr");
  
  if (type === "spell") {
    document.getElementById("pmsg").textContent = "Possible misspelling";
    var sugs = error.suggestions;
    if (sugs && sugs.length > 0) {
      var html = "";
      sugs.forEach(function(s) {
        html += '<button class="psug" onclick="replacWord(\'' + escH(word) + '\',\'' + escH(s) + '\')">' + escH(s) + '<span class="arr">→</span></button>';
      });
      document.getElementById("psug").innerHTML = html;
    } else {
      document.getElementById("psug").innerHTML = '<div class="pno">No suggestions available</div>';
    }
    document.getElementById("pign").style.display = "block";
    document.getElementById("pign").setAttribute("data-word", word);
  } else {
    document.getElementById("pmsg").textContent = error.message;
    if (error.suggestion) {
      document.getElementById("psug").innerHTML = '<button class="psug" onclick="replacWord(\'' + escH(word) + '\',\'' + escH(error.suggestion) + '\')">' + escH(error.suggestion) + '<span class="arr">→</span></button>';
    } else {
      document.getElementById("psug").innerHTML = '<div class="pno">Review manually</div>';
    }
    document.getElementById("pign").style.display = "none";
  }
  
  popup.style.display = "block";
  popup.style.left = e.pageX + "px";
  popup.style.top = (e.pageY + 20) + "px";
}

function closePopup() {
  document.getElementById("popup").style.display = "none";
}

function replacWord(oldWord, newWord) {
  var ta = document.getElementById("ta");
  savedCursorPosition = ta.selectionStart;
  
  var text = ta.value;
  var pattern = new RegExp("\\b" + escRe(oldWord) + "\\b", "gi");
  ta.value = text.replace(pattern, newWord);
  
  closePopup();
  checkText();
  
  setTimeout(function() {
    ta.focus();
    ta.setSelectionRange(savedCursorPosition, savedCursorPosition);
  }, 100);
}

function ignoreWord() {
  var word = document.getElementById("pign").getAttribute("data-word");
  ignoredWords[word.toLowerCase()] = true;
  closePopup();
  checkText();
  showToast("'" + word + "' ignored");
}

function fixAll() {
  var ta = document.getElementById("ta");
  var text = ta.value;
  
  spellErrors.forEach(function(err) {
    if (err.suggestions && err.suggestions.length > 0) {
      var pattern = new RegExp("\\b" + escRe(err.word) + "\\b", "gi");
      text = text.replace(pattern, err.suggestions[0]);
    }
  });
  
  grammarErrors.forEach(function(err) {
    if (err.suggestion) {
      var pattern = new RegExp(escRe(err.word), "gi");
      text = text.replace(pattern, err.suggestion);
    }
  });
  
  ta.value = text;
  checkText();
  showToast("Auto-fixed " + (spellErrors.length + grammarErrors.length) + " issues!");
}

// ══════════════════════════════════════════════════════════════
// JUMP TO WORD
// ══════════════════════════════════════════════════════════════
function jumpToWord(word) {
  document.querySelectorAll(".hl-spell,.hl-gram").forEach(function(s) {
    if (s.textContent.toLowerCase() === word.toLowerCase()) {
      s.style.outline = "2px solid var(--accent)";
      s.scrollIntoView({behavior: "smooth", block: "center"});
      setTimeout(function() { s.style.outline = ""; }, 2000);
    }
  });
}

// ══════════════════════════════════════════════════════════════
// COPY / CLEAR
// ══════════════════════════════════════════════════════════════
function copyFixed() {
  var v = document.getElementById("ta").value;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(v).then(function() {
      showToast("Copied to clipboard!");
    }).catch(function() {
      showToast("Press Ctrl+A then Ctrl+C");
    });
  } else {
    var ta = document.getElementById("ta");
    ta.select();
    document.execCommand("copy");
    showToast("Copied!");
  }
}

function clearAll() {
  var ta = document.getElementById("ta");
  ta.value = "";
  var od = document.getElementById("odisplay");
  od.classList.remove("active");
  od.innerHTML = "";
  
  spellErrors = [];
  grammarErrors = [];
  isChecked = false;
  ignoredWords = {};
  closePopup();
  
  document.getElementById("fixall-btn").style.display = "none";
  document.getElementById("splist").innerHTML = '<div class="empty"><div class="ei">✏️</div><div class="em">Check text to see issues</div></div>';
  document.getElementById("grlist").innerHTML = '<div class="empty"><div class="ei">📝</div><div class="em">Check text to see issues</div></div>';
  
  document.getElementById("snum").textContent = "—";
  document.getElementById("slabel").textContent = "Check to score";
  document.getElementById("rfill").style.strokeDashoffset = "220";
  
  ["ss","sg","sw","sst"].forEach(function(id) {
    document.getElementById(id).textContent = "0";
  });
  
  document.getElementById("tsp").textContent = "🔴 Spelling";
  document.getElementById("tgr").textContent = "🟡 Grammar";
  
  updateWordCount();
  ta.focus();
}

// ══════════════════════════════════════════════════════════════
// THEME TOGGLE
// ══════════════════════════════════════════════════════════════
function toggleTheme() {
  var html = document.documentElement;
  var isDark = html.getAttribute("data-theme") === "dark";
  html.setAttribute("data-theme", isDark ? "light" : "dark");
  document.getElementById("trk").classList.toggle("on", !isDark);
  document.getElementById("ticon").textContent = isDark ? "☀️" : "🌙";
  document.getElementById("tlbl").textContent = isDark ? "Light" : "Dark";
  if (isChecked) checkText();
}

// ══════════════════════════════════════════════════════════════
// DOMAIN TOGGLE
// ══════════════════════════════════════════════════════════════
function setDomain(domain, btn) {
  var allBtn = document.querySelector('[data-d="all"]');
  var genBtn = document.querySelector('[data-d="general"]');
  
  if (domain === "all") {
    activeDomains = {all: true};
    document.querySelectorAll(".dbtn").forEach(function(b) { b.classList.remove("on"); });
    btn.classList.add("on");
  } else {
    allBtn.classList.remove("on");
    delete activeDomains.all;
    btn.classList.toggle("on");
    if (btn.classList.contains("on")) {
      activeDomains[domain] = true;
    } else {
      delete activeDomains[domain];
    }
    if (Object.keys(activeDomains).length === 0) {
      activeDomains.general = true;
      genBtn.classList.add("on");
    }
  }
  
  if (document.getElementById("ta").value.trim() && isChecked) {
    checkText();
  }
}

// ══════════════════════════════════════════════════════════════
// TABS
// ══════════════════════════════════════════════════════════════
function switchTab(tab) {
  curTab = tab;
  document.getElementById("tsp").classList.toggle("on", tab === "sp");
  document.getElementById("tgr").classList.toggle("on", tab === "gr");
  document.getElementById("splist").style.display = tab === "sp" ? "block" : "none";
  document.getElementById("grlist").style.display = tab === "gr" ? "block" : "none";
}

// ══════════════════════════════════════════════════════════════
// INPUT HANDLING (IMPROVED - PRESERVES CURSOR)
// ══════════════════════════════════════════════════════════════
function onInput() {
  var ta = document.getElementById("ta");
  savedCursorPosition = ta.selectionStart;
  
  updateWordCount();
  
  if (isChecked) {
    document.getElementById("odisplay").classList.remove("active");
    isChecked = false;
    document.getElementById("fixall-btn").style.display = "none";
  }
  
  scheduleAutoCheck();
}

function updateWordCount() {
  var t = document.getElementById("ta").value;
  document.getElementById("wc").textContent = t.trim() ? t.trim().split(/\s+/).length : 0;
  document.getElementById("cc").textContent = t.length;
}

// ══════════════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════════════
function escH(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function escRe(s) {
  return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function showToast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function() { t.classList.remove("show"); }, 2800);
}

// ══════════════════════════════════════════════════════════════
// AUTO-CHECK (debounced)
// ══════════════════════════════════════════════════════════════
var autoCheckTimer = null;
function scheduleAutoCheck() {
  clearTimeout(autoCheckTimer);
  var text = document.getElementById("ta").value;
  if (text.trim().length < 10) return;
  
  autoCheckTimer = setTimeout(function() {
    if (document.getElementById("ta").value.trim().length >= 10) {
      checkText();
    }
  }, 1200);
}

// ══════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════
window.addEventListener("load", function() {
  document.getElementById("ta").value = "";
  updateWordCount();
  document.getElementById("ta").focus();
});

document.addEventListener("DOMContentLoaded", function() {
  document.getElementById("odisplay").addEventListener("click", function(e) {
    if (e.target === document.getElementById("odisplay")) {
      var ta = document.getElementById("ta");
      ta.focus();
      ta.setSelectionRange(savedCursorPosition, savedCursorPosition);
    }
  });
  
  // Close popup when clicking outside
  document.addEventListener("click", function(e) {
    var popup = document.getElementById("popup");
    if (!popup.contains(e.target) && !e.target.classList.contains("hl-spell") && !e.target.classList.contains("hl-gram")) {
      closePopup();
    }
  });
});
</script>
</body>
</html>
